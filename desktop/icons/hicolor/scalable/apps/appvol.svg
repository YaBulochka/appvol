<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>appvol</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#56c5f7"/>
      <stop offset="1" stop-color="#1a72c0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="16" y="16" width="224" height="224" rx="56" fill="url(#bg)"/>
  <rect x="16" y="16" width="224" height="224" rx="56" fill="url(#shine)"/>
  <rect x="17" y="17" width="222" height="222" rx="55" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>

  <!-- window dots: "per application" -->
  <g fill="#ffffff" fill-opacity="0.55">
    <circle cx="66" cy="50" r="5"/>
    <circle cx="84" cy="50" r="5"/>
    <circle cx="102" cy="50" r="5"/>
  </g>

  <!-- speaker -->
  <g transform="translate(0 2)">
    <polygon points="62,106 94,106 130,76 130,176 94,146 62,146"
             fill="#ffffff" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>
    <g fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round">
      <path d="M160 102 A34 34 0 0 1 160 150"/>
      <path d="M180 82 A62 62 0 0 1 180 170"/>
    </g>
  </g>

  <!-- volume slider -->
  <line x1="62" y1="208" x2="194" y2="208" stroke="#ffffff" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round"/>
  <line x1="62" y1="208" x2="144" y2="208" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <circle cx="144" cy="208" r="13" fill="#ffffff"/>
</svg>
