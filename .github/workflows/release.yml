name: release

# Everything is built here: the workflow runs on every push to main (build
# only), and on a version tag it also publishes the GitHub Release.  Dispatch it
# with a tag to rebuild or backfill the assets of a release by hand.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish (for example v0.4.1)
        required: true

# Read-only by default; only the publish job gets write access to the releases.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dbus python3-gi python3-pulsectl
      - name: Run the unit tests
        run: python3 -m unittest discover -s tests -t .

  tarball:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Build the release archive
        run: bin/appvol-release
      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: dist/*.tar.gz

  pacman:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Build the split pacman packages
        run: |
          docker run --rm \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -v "$PWD:/src" -w /src archlinux:latest \
            bash -euxo pipefail -c '
              pacman-key --init
              pacman-key --populate archlinux
              pacman -Syu --noconfirm base-devel git python zstd
              groupadd -g "$HOST_GID" builder 2>/dev/null || true
              useradd -m -u "$HOST_UID" -g "$HOST_GID" builder
              chown -R builder:builder /src
              su builder -c "cd /src && bin/appvol-release --package"
            '
      - uses: actions/upload-artifact@v7
        with:
          name: pacman
          path: dist/*.pkg.tar.zst

  deb-rpm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install fpm and the rpm tools
        run: |
          gem install --no-document fpm
          sudo apt-get update
          sudo apt-get install -y rpm
      - name: Build the .deb and .rpm packages
        run: bin/appvol-release --deb --rpm
      - uses: actions/upload-artifact@v7
        with:
          name: deb-rpm
          path: |
            dist/*.deb
            dist/*.rpm

  # Install the built packages into the distributions they target and run the
  # CLI once, so a broken dependency name or a bad file list fails the build.
  smoke:
    needs: deb-rpm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: deb-rpm
          path: dist
      - name: Smoke-test the packages on Debian 13
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" debian:13 bash -euxo pipefail -c '
            apt-get update
            apt-get install -y /dist/appvol*.deb
            appvol --help
            test -f /usr/share/icons/hicolor/scalable/apps/appvol.svg
          '
      - name: Smoke-test the packages on Fedora
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest bash -euxo pipefail -c '
            dnf install -y /dist/appvol*.rpm
            appvol --help
            test -f /usr/share/icons/hicolor/scalable/apps/appvol.svg
          '

  publish:
    needs: [test, tarball, pacman, deb-rpm, smoke]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # gh reads the repository from the checkout; without it, it bails with
      # "not a git repository".
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum ./* > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" --title "appvol ${TAG#v}" --generate-notes dist/*
          fi
